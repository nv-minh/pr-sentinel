# PR Sentinel configuration.
org: sample-org             # default org when a repo is listed by bare name
default_mode: manual        # repos not listed here are skipped by the poller
interval_minutes: 2
post_comment: true
skip_human: true
drafts: false
skip_bots: true
# Where LLM calls go. Built in:
#   anthropic (default) -> api.anthropic.com                -> ANTHROPIC_API_KEY
#   deepseek            -> https://api.deepseek.com/anthropic -> DEEPSEEK_API_KEY
#   glm (Z.ai)          -> https://api.z.ai/api/anthropic     -> ZAI_API_KEY
# Tokens are NEVER stored here — set them in .env.
provider: anthropic
providers: {}
# Example of a gateway that is not built in — every key below is required:
# providers:
#   my-gateway:
#     base_url: https://llm.internal.example.com/anthropic
#     token_env: MY_GATEWAY_TOKEN
#     model: big-model
#     claims_model: small-model
#     structured_output: prompt   # native only if it implements Anthropic's
#     reports_cost: false         # structured-outputs beta and prices in USD

# Review behaviour. With tiered_budget on, allow_bash and max_turns are the
# STANDARD tier's values — a docs-only PR gets less, a PR touching
# gate.sensitive_areas or a contract file gets more. Turn tiered_budget off to
# apply these flatly to every review.
tiered_budget: true
allow_bash: false           # let the agent run git/grep inside the workspace clone
max_turns: 60
max_budget_usd: null        # e.g. 2.0 to hard-stop an expensive verify run

# Actions that write outside the review comment — opt-in on purpose
auto_describe: false        # rewrite an empty PR body instead of proposing one
docs_fix_pr: false          # open a follow-up PR carrying the doc fixes
inline_suggestions: true    # suggestion blocks for docs inside the diff
poc_tests: true             # a failing test for each BROKEN finding (only runs when
                            # a review finds one, so a clean PR pays nothing)
max_inline_comments: 20     # per review; anything past this goes in the summary

# Jira. Tokens are NEVER stored here — set JIRA_BASE_URL, JIRA_EMAIL and
# JIRA_API_TOKEN in .env. `projects` is the allowlist that stops UTF-8 and
# CVE-2024-1234 being mistaken for ticket keys; a pasted /browse/ link is
# always honoured without it.
jira:
  projects: []              # e.g. [ABC, PRJ]
  comment_result: false     # post the verdict back to the primary ticket

gate:
  verification_score_min: 0.8
  sensitive_areas:
    - "**/payment*/**"
    - "**/billing/**"
    - "**/auth*/**"
    - "**/migrations/**"
    - "**/checkout/**"
  core_docs:
    - "README.md"
    - "docs/**"
    - "**/openapi*.y*ml"
    - "**/openapi*.json"
    - "**/*.proto"
    - "API.md"

repos:
  sample-app: auto
  sample-api: manual
