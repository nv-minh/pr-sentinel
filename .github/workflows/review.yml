name: PR Sentinel review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# One review per PR at a time: a new push cancels the review of the old commit.
concurrency:
  group: pr-sentinel-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  review:
    # For comments: only run on PR comments that are not the bot's own.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6

      - name: Restore review state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cold() { echo "Starting cold: $1"; rm -f session.zip; exit 0; }
          id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=pr-sentinel-session-$PR_NUMBER&per_page=1" \
            --jq '.artifacts[0].id // empty') \
            || cold "could not list artifacts for PR $PR_NUMBER"
          [ -n "$id" ] || cold "no previous session artifact for PR $PR_NUMBER"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > session.zip \
            || cold "artifact $id could not be downloaded"
          mkdir -p sessions
          unzip -q -o session.zip -d sessions || cold "artifact $id was not a readable zip"
          rm -f session.zip
          echo "Restored session artifact $id."

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -e .

      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # A comment event means someone answered the bot: resume the previous
          # session instead of paying for a full re-review.
          MODE: ${{ github.event_name == 'issue_comment' && '--reply' || '--force' }}
        run: |
          python -m src.run "$GITHUB_REPOSITORY" "$PR_NUMBER" --ci $MODE

      - name: Upload session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-sentinel-session-${{ env.PR_NUMBER }}
          path: |
            sessions
            !sessions/**/workspace
            !sessions/**/workspace/**
          if-no-files-found: ignore
          retention-days: 14
