name: PR Sentinel review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# One review per PR at a time: a new push cancels the review of the old commit.
concurrency:
  group: pr-sentinel-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  review:
    # For comments: only run on PR comments that are not the bot's own.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -e .

      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # A comment event means someone answered the bot: resume the previous
          # session instead of paying for a full re-review.
          MODE: ${{ github.event_name == 'issue_comment' && '--reply' || '--force' }}
        run: |
          python -m src.run "$GITHUB_REPOSITORY" "$PR_NUMBER" --ci $MODE

      - name: Upload session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-sentinel-session
          path: |
            sessions/**/report.md
            sessions/**/findings.json
            sessions/**/score.json
            sessions/**/usage.json
          if-no-files-found: ignore
          retention-days: 14
